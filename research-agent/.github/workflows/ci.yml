name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install locked development environment
        run: uv sync --extra dev --frozen
      - name: Validate portable Skill
        run: uv run pytest tests/test_research_skill.py
      - name: Run deterministic offline tests
        run: uv run pytest
      - name: Compile Python sources
        run: uv run python -m compileall -q src
      - name: Build wheel and source distribution
        run: uv build
